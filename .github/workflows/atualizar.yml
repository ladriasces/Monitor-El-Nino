# Atualiza os dados e publica o site no GitHub Pages.
#
# - O GitHub não garante o horário das execuções agendadas (neste repositório, descarta quase todas).
#   Por isso quem dispara a rotina a cada 15 minutos é o acionador do Google Apps Script, na conta do
#   LADRI (acionador/acionador.gs), com o modo "agenda"; o agendamento abaixo fica só como reserva.
#   Em cada execução, o primeiro job ("plano") decide, pela idade dos dados já publicados, o que está
#   na hora (01_coleta.py --plano):
#     avisos do INMET e da OMM e notícias: a cada hora; focos do INPE: a cada 6 horas;
#     El Niño, Pacífico, chuva, temperatura e previsão: uma vez por dia, a partir das 04h UTC (01h em Brasília);
#     mundo (GDACS e Copernicus): uma vez por dia, só entre 04h00 e 06h45 UTC, o horário que o robots.txt
#     do GDACS pede.
#   Se nada estiver na hora, a execução termina ali, sem publicar.
# - Envio de código (push) ou execução manual: atualiza tudo (o mundo, só dentro do horário do GDACS).
# - Os JSON do dia (docs/dados/) não vão para o repositório: são gerados aqui e publicados direto no Pages.
#   Só a série de focos do satélite de referência (data/ref/focos_ref_diario.csv), que cresce dia a dia, é gravada.
# - 04_validar.py confere tudo antes de publicar: se reprovar, o site continua na última versão boa.
# - As ações de terceiros estão fixadas pelo SHA do commit (com a versão no comentário), para que uma
#   etiqueta alterada no repositório delas não mude o que roda aqui.
#
# Configuração única no GitHub: Settings → Pages → Source: "GitHub Actions".
name: Atualizar dados e publicar

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # reserva do acionador do Google (a cada 15 min, fora da virada da hora)
  workflow_dispatch:
    inputs:
      modo:
        description: "completo = atualiza tudo (execução manual); agenda = só o que está na hora (usado pelo acionador do Google)"
        type: choice
        options: [completo, agenda]
        default: completo
      gdelt_horas:
        description: "Horas de notícias do GDELT (3 = normal; 72 na primeira execução, para encher a aba de notícias)"
        default: "3"
  push:
    branches: [main]
    paths: ["docs/index.html", "0*.py", "clima_comum.py", ".github/workflows/atualizar.yml"]

permissions:
  contents: read

concurrency:
  group: atualizar
  cancel-in-progress: false

env:
  SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  plano:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      fontes: ${{ steps.plano.outputs.fontes }}
      blocos: ${{ steps.plano.outputs.blocos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Decidir o que está na hora
        id: plano
        env:
          # Envio de código ou execução manual: tudo. Agendamento ou acionador do Google (modo "agenda"): só o que está na hora.
          COMPLETO: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.modo != 'agenda')) && '--completo' || '' }}
        run: |
          mkdir -p docs/dados
          curl -sfL "$SITE/dados/atualizacao.json" -o docs/dados/atualizacao.json || rm -f docs/dados/atualizacao.json
          python 01_coleta.py --plano $COMPLETO | tee -a "$GITHUB_OUTPUT"

  atualizar:
    needs: plano
    if: needs.plano.outputs.blocos != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write      # gravar a série de focos
      pages: write         # publicar no Pages
      id-token: write      # exigido pelo deploy do Pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # Se uma fonte falhar (ou não for consultada nesta execução), os dados publicados antes são mantidos
      - name: Recuperar os dados publicados
        run: |
          mkdir -p docs/dados/serie
          for f in enso pacifico clima focos avisos mundo swic noticias atualizacao; do
            curl -sfL "$SITE/dados/$f.json" -o "docs/dados/$f.json" || rm -f "docs/dados/$f.json"
          done
          for uf in AC AL AM AP BA CE DF ES GO MA MG MS MT PA PB PE PI PR RJ RN RO RR RS SC SE SP TO; do
            curl -sfL "$SITE/dados/serie/$uf.json" -o "docs/dados/serie/$uf.json" || rm -f "docs/dados/serie/$uf.json"
          done

      - name: Coleta
        env:
          FONTES: ${{ needs.plano.outputs.fontes }}
          GDELT_HORAS: ${{ inputs.gdelt_horas || '3' }}   # via variável (não direto no comando): o Python só aceita 1–336
        run: python 01_coleta.py --fonte $FONTES --gdelt-horas "$GDELT_HORAS"

      - name: Tratamento
        env:
          BLOCOS: ${{ needs.plano.outputs.blocos }}
        run: python 02_tratamento.py --bloco $BLOCOS

      - name: Validação
        run: python 04_validar.py

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

      - name: Gravar a série de focos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ref/focos_ref_diario.csv
          if ! git diff --cached --quiet; then
            git commit -m "Focos do INPE: $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
            git pull --rebase && git push
          fi
